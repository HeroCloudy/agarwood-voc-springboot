spring:
  application:
    name: agarwood-voc-service
  datasource:
    url: jdbc:mysql://localhost:3306/agarwood_voc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
    username: root
    password: Mysql.123
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: agarwood-voc-hikari-pool
  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.xml
server:
  port: 9001
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

logging:
  level:
    com.agarwood.voc: debug

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.agarwood.voc.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  group-configs:
    - group: 全部接口
      paths-to-match:
        - /**
    - group: 测试接口
      paths-to-match:
        - /foo/**

agarwood:
  mybatis-plus:
    pagination: true
    auto-fill: true
  doc:
    info:
      title: Agarwood VOC 接口文档
      description: Agarwood VOC 智能问卷系统接口文档，包含问卷管理、问卷填写、数据统计等功能
      version: v1.0.0
      license:
        name: Apache 2.0
        url: https://www.apache.org/licenses/LICENSE-2.0
    external-docs:
      description: 项目文档
      url: https://github.com/HeroCloudy/agarwood-voc-springboot